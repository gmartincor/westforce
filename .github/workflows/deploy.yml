name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================
  # JOB 1: Build y Test
  # ===========================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build summary
        run: |
          echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================
  # JOB 2: Deploy to Production
  # ===========================================
  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no $USER@$HOST << 'DEPLOY_SCRIPT'
            set -e
            
            # Variables
            APP_DIR="/opt/projects/westforce"
            COMPOSE_FILE="docker-compose.prod.yml"
            
            echo "🚀 Iniciando despliegue..."
            cd $APP_DIR
            
            # Actualizar código
            echo "📥 Actualizando código..."
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            
            # Actualizar imagen
            echo "🐳 Descargando nueva imagen..."
            docker compose -f $COMPOSE_FILE pull web 2>/dev/null || true
            
            # Construir si no hay imagen remota
            if ! docker compose -f $COMPOSE_FILE pull web 2>/dev/null; then
              echo "🔨 Construyendo imagen localmente..."
              docker compose -f $COMPOSE_FILE build web
            fi
            
            # Desplegar con zero-downtime
            echo "🔄 Desplegando..."
            docker compose -f $COMPOSE_FILE up -d --remove-orphans
            
            # Esperar a que la aplicación esté lista
            echo "⏳ Esperando a que la aplicación esté lista..."
            sleep 15
            
            # Verificar salud
            MAX_RETRIES=30
            RETRY=0
            while [[ $RETRY -lt $MAX_RETRIES ]]; do
              if curl -sf http://localhost:8000/health/ > /dev/null 2>&1; then
                echo "✅ Aplicación saludable"
                break
              fi
              RETRY=$((RETRY + 1))
              sleep 2
            done
            
            if [[ $RETRY -eq $MAX_RETRIES ]]; then
              echo "❌ La aplicación no respondió"
              docker compose -f $COMPOSE_FILE logs --tail=50 web
              exit 1
            fi
            
            # Limpiar imágenes antiguas
            echo "🧹 Limpiando imágenes antiguas..."
            docker image prune -f
            
            echo "✅ Despliegue completado exitosamente"
          DEPLOY_SCRIPT

      - name: Notify deployment success
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://westforceremovals.com" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs for more details." >> $GITHUB_STEP_SUMMARY

  # ===========================================
  # JOB 3: Health Check post-deploy
  # ===========================================
  health-check:
    name: Post-Deploy Health Check
    needs: deploy
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Check application health
        run: |
          response=$(curl -sf https://westforceremovals.com/health/ || echo "FAILED")
          if [[ "$response" == "FAILED" ]]; then
            echo "❌ Health check failed"
            exit 1
          fi
          echo "✅ Health check passed"
          echo "$response" | jq . 2>/dev/null || echo "$response"

      - name: Check SSL certificate
        run: |
          echo | openssl s_client -servername westforceremovals.com -connect westforceremovals.com:443 2>/dev/null | openssl x509 -noout -dates

      - name: Ping Healthchecks.io
        if: success()
        run: |
          curl -fsS --retry 3 https://hc-ping.com/94648cf3-09f9-4934-8c59-c8190064bb1c || true
