name: westforce-production
# =============================================================================
# Production Docker Compose - Optimized for Hetzner CX23
# Server: 2 vCPU, 4GB RAM, 40GB SSD - €0.0056/hour (~€4.08/month)
# =============================================================================

services:
  traefik:
    image: traefik:v3.2
    container_name: westforce-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ACME_EMAIL=${ACME_EMAIL:-admin@westforceremovals.com}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_data:/letsencrypt
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      # Dashboard (opcional, desactivar en producción si no se necesita)
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN:-westforceremovals.com}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH:-}"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:15-alpine
    container_name: westforce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-westforce_removals}
      POSTGRES_USER: ${DB_USER:-westforce}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-westforce} -d ${DB_NAME:-westforce_removals}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M  # Optimized for CX23 (4GB total)
        reservations:
          memory: 192M

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-gmartincor/westforce}:${IMAGE_TAG:-latest}
    container_name: westforce-web
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEBUG: "False"
      ENVIRONMENT: production
      DB_NAME: ${DB_NAME:-westforce_removals}
      DB_USER: ${DB_USER:-westforce}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: postgres
      DB_PORT: "5432"
      DATABASE_URL: postgresql://${DB_USER:-westforce}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-westforce_removals}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-westforceremovals.com,www.westforceremovals.com}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://westforceremovals.com,https://www.westforceremovals.com}
      PORT: "8000"
      # Company
      COMPANY_NAME: ${COMPANY_NAME:-Westforce Removals Company}
      COMPANY_TAGLINE: ${COMPANY_TAGLINE:-Professional Australian Removals Company Management System}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-westforce.analytics@gmail.com}
      COMPANY_PHONE: ${COMPANY_PHONE:-+61-8-9234-5678}
      COMPANY_PHONE_DISPLAY: ${COMPANY_PHONE_DISPLAY:-(08) 9234 5678}
      COMPANY_ADDRESS_CITY: ${COMPANY_ADDRESS_CITY:-Perth}
      COMPANY_ADDRESS_STATE: ${COMPANY_ADDRESS_STATE:-WA}
      COMPANY_ADDRESS_COUNTRY: ${COMPANY_ADDRESS_COUNTRY:-AU}
      COMPANY_LATITUDE: ${COMPANY_LATITUDE:--31.9505}
      COMPANY_LONGITUDE: ${COMPANY_LONGITUDE:-115.8605}
      COMPANY_RATING: ${COMPANY_RATING:-4.8}
      COMPANY_REVIEW_COUNT: ${COMPANY_REVIEW_COUNT:-127}
      COMPANY_ESTABLISHED_YEAR: ${COMPANY_ESTABLISHED_YEAR:-2020}
      # Email
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      QUOTE_RECIPIENT_EMAIL: ${QUOTE_RECIPIENT_EMAIL:-westforce.analytics@gmail.com}
      # Analytics
      GOOGLE_ANALYTICS_ID: ${GOOGLE_ANALYTICS_ID:-}
      GOOGLE_TAG_MANAGER_ID: ${GOOGLE_TAG_MANAGER_ID:-}
    volumes:
      - media_data:/app/media
      - static_data:/app/static_collected
      - ./logs:/app/logs
    networks:
      - internal
      - web
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # HTTP -> HTTPS redirect
      - "traefik.http.routers.web-http.rule=Host(`${DOMAIN:-westforceremovals.com}`) || Host(`www.${DOMAIN:-westforceremovals.com}`)"
      - "traefik.http.routers.web-http.entrypoints=web"
      - "traefik.http.routers.web-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
      # HTTPS
      - "traefik.http.routers.web-secure.rule=Host(`${DOMAIN:-westforceremovals.com}`) || Host(`www.${DOMAIN:-westforceremovals.com}`)"
      - "traefik.http.routers.web-secure.entrypoints=websecure"
      - "traefik.http.routers.web-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web-secure.middlewares=secure-headers,www-redirect"
      # WWW -> non-WWW redirect
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.(.+)"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.www-redirect.redirectregex.permanent=true"
      # Security headers
      - "traefik.http.middlewares.secure-headers.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.secure-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.secure-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.secure-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.secure-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.secure-headers.headers.referrerPolicy=same-origin"
      # Service
      - "traefik.http.services.web.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1536M  # Optimized for CX23: allows 3 gunicorn workers
        reservations:
          memory: 768M

  # Backup automático de la base de datos (ejecuta diariamente)
  db-backup:
    image: postgres:15-alpine
    container_name: westforce-db-backup
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER:-westforce}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATABASE: ${DB_NAME:-westforce_removals}
    volumes:
      - ./backups:/backups
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "pg_dump -Fc > /backups/westforce_$$(date +%Y%m%d_%H%M%S).dump && 
          find /backups -name '*.dump' -mtime +7 -delete && 
          echo 'Backup completed successfully'"
    profiles:
      - backup

volumes:
  postgres_data:
    name: westforce_prod_postgres_data
    driver: local
  media_data:
    name: westforce_prod_media_data
    driver: local
  static_data:
    name: westforce_prod_static_data
    driver: local
  traefik_data:
    name: westforce_prod_traefik_data
    driver: local

networks:
  web:
    name: westforce_web
    driver: bridge
  internal:
    name: westforce_internal
    driver: bridge
    internal: true
