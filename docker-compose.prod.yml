name: westforce-production

services:
  postgres:
    image: postgres:15-alpine
    container_name: westforce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-westforce_removals}
      POSTGRES_USER: ${DB_USER:-westforce}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-westforce} -d ${DB_NAME:-westforce_removals}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: westforce-web
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEBUG: "False"
      ENVIRONMENT: production
      DB_NAME: ${DB_NAME:-westforce_removals}
      DB_USER: ${DB_USER:-westforce}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: postgres
      DB_PORT: "5432"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-westforceremovals.com,www.westforceremovals.com}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://westforceremovals.com,https://www.westforceremovals.com}
      PORT: "8000"
      COMPANY_NAME: ${COMPANY_NAME:-Westforce Removals Company}
      COMPANY_TAGLINE: ${COMPANY_TAGLINE:-Professional Australian Removals Company Management System}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-westforce.analytics@gmail.com}
      COMPANY_PHONE: ${COMPANY_PHONE:-+61-8-9234-5678}
      COMPANY_PHONE_DISPLAY: ${COMPANY_PHONE_DISPLAY:-(08) 9234 5678}
      COMPANY_ADDRESS_CITY: ${COMPANY_ADDRESS_CITY:-Perth}
      COMPANY_ADDRESS_STATE: ${COMPANY_ADDRESS_STATE:-WA}
      COMPANY_ADDRESS_COUNTRY: ${COMPANY_ADDRESS_COUNTRY:-AU}
      COMPANY_LATITUDE: ${COMPANY_LATITUDE:--31.9505}
      COMPANY_LONGITUDE: ${COMPANY_LONGITUDE:-115.8605}
      COMPANY_RATING: ${COMPANY_RATING:-4.8}
      COMPANY_REVIEW_COUNT: ${COMPANY_REVIEW_COUNT:-127}
      COMPANY_ESTABLISHED_YEAR: ${COMPANY_ESTABLISHED_YEAR:-2020}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      QUOTE_RECIPIENT_EMAIL: ${QUOTE_RECIPIENT_EMAIL:-westforce.analytics@gmail.com}
      GOOGLE_ANALYTICS_ID: ${GOOGLE_ANALYTICS_ID:-}
      GOOGLE_TAG_MANAGER_ID: ${GOOGLE_TAG_MANAGER_ID:-}
    volumes:
      - media_data:/app/media
      - static_data:/app/static_collected
      - ./logs:/app/logs
    networks:
      - internal
      - traefik-public
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.westforce-http.rule=Host(`${DOMAIN:-westforceremovals.com}`) || Host(`www.${DOMAIN:-westforceremovals.com}`)"
      - "traefik.http.routers.westforce-http.entrypoints=web"
      - "traefik.http.routers.westforce-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
      - "traefik.http.routers.westforce-secure.rule=Host(`${DOMAIN:-westforceremovals.com}`) || Host(`www.${DOMAIN:-westforceremovals.com}`)"
      - "traefik.http.routers.westforce-secure.entrypoints=websecure"
      - "traefik.http.routers.westforce-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.westforce-secure.middlewares=westforce-headers,westforce-www-redirect"
      - "traefik.http.middlewares.westforce-www-redirect.redirectregex.regex=^https://www\\.(.+)"
      - "traefik.http.middlewares.westforce-www-redirect.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.westforce-www-redirect.redirectregex.permanent=true"
      - "traefik.http.middlewares.westforce-headers.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.westforce-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.westforce-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.westforce-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.westforce-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.westforce-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.westforce-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.westforce-headers.headers.referrerPolicy=same-origin"
      - "traefik.http.services.westforce.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  db-backup:
    image: postgres:15-alpine
    container_name: westforce-db-backup
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER:-westforce}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATABASE: ${DB_NAME:-westforce_removals}
    volumes:
      - ./backups:/backups
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "pg_dump -Fc > /backups/westforce_$$(date +%Y%m%d_%H%M%S).dump && 
          find /backups -name '*.dump' -mtime +7 -delete && 
          echo 'Backup completed'"
    profiles:
      - backup

volumes:
  postgres_data:
    name: westforce_postgres
  media_data:
    name: westforce_media
  static_data:
    name: westforce_static

networks:
  traefik-public:
    external: true
  internal:
    name: westforce_internal
    driver: bridge
    internal: true
