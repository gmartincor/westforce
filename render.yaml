services:
  - type: web
    name: westforce-web
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health/
    
    domains:
      - westforce.com
      - www.westforce.com
    
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      
      - key: ENVIRONMENT
        value: production
      
      - key: SECRET_KEY
        generateValue: true
      
      - key: ALLOWED_HOSTS
        value: westforce.com,www.westforce.com,westforce.onrender.com,westforce-web.onrender.com
      
      - key: CSRF_TRUSTED_ORIGINS
        value: https://westforce.com,https://www.westforce.com,https://westforce.onrender.com,https://westforce-web.onrender.com
      
      - key: DATABASE_URL
        value: postgresql://westforce_user:Ol9d6aF3hzqdcqaaSGvIGCZocGkYzMQ7@dpg-d41v1rf5r7bs73e23mc0-a/westforce
      
      - key: COMPANY_NAME
        value: Westforce Removals Company
      
      - key: COMPANY_TAGLINE
        value: Professional Australian Removals Company Management System
      
      - key: RESEND_API_KEY
        sync: false
      
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      
      - key: QUOTE_RECIPIENT_EMAIL
        value: info@westforceremovals.com.au
      
      - key: EMAIL_HOST
        value: smtp.gmail.com
      
      - key: EMAIL_PORT
        value: "587"
      
      - key: EMAIL_USE_TLS
        value: "true"
      
      - key: EMAIL_HOST_USER
        value: ""
      
      - key: EMAIL_HOST_PASSWORD
        value: ""
      
      - key: DEFAULT_FROM_EMAIL
        value: noreply@westforce.com
