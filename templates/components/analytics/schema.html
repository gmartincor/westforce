{% load static %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MovingCompany",
  "name": "{{ company_name }}",
  "description": "{{ seo_meta_description }}",
  "url": "{{ request.scheme }}://{{ request.get_host }}",
  "logo": "{{ request.scheme }}://{{ request.get_host }}{% static 'images/landing/logo/Company_logo.jpeg' %}",
  "image": "{{ request.scheme }}://{{ request.get_host }}{% static seo_og_image_path %}",
  "telephone": "{{ company_phone }}",
  "email": "{{ company_email }}",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "{{ company_address_city }}",
    "addressRegion": "{{ company_address_state }}",
    "addressCountry": "{{ company_address_country }}"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": "{{ company_latitude }}",
    "longitude": "{{ company_longitude }}"
  },
  "priceRange": "$$",
  "areaServed": [
    {
      "@type": "City",
      "name": "{{ company_address_city }}"
    },
    {
      "@type": "State",
      "name": "Western Australia"
    },
    {
      "@type": "Country",
      "name": "Australia"
    }
  ],
  "serviceArea": {
    "@type": "GeoCircle",
    "geoMidpoint": {
      "@type": "GeoCoordinates",
      "latitude": "{{ company_latitude }}",
      "longitude": "{{ company_longitude }}"
    },
    "geoRadius": "500000"
  },
  "openingHoursSpecification": [
    {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
      "opens": "07:00",
      "closes": "18:00"
    },
    {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": "Saturday",
      "opens": "07:00",
      "closes": "14:00"
    }
  ],
  "aggregateRating": {
    "@type": "AggregateRating",
    "ratingValue": "{{ company_rating }}",
    "reviewCount": "{{ company_review_count }}"
  },
  "hasOfferCatalog": {
    "@type": "OfferCatalog",
    "name": "Moving Services",
    "itemListElement": [
      {
        "@type": "Offer",
        "itemOffered": {
          "@type": "Service",
          "name": "Local Moving Services",
          "description": "Professional moving services across Perth metropolitan area"
        }
      },
      {
        "@type": "Offer",
        "itemOffered": {
          "@type": "Service",
          "name": "Interstate Moving Services",
          "description": "Seamless relocations across Australia"
        }
      },
      {
        "@type": "Offer",
        "itemOffered": {
          "@type": "Service",
          "name": "Office Relocations",
          "description": "Expert handling of commercial moves"
        }
      }
    ]
  }
}
</script>
