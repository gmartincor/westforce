{% load static %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<title>{% block meta_title %}{{ seo_meta_title }}{% endblock %}</title>
<meta name="description" content="{% block meta_description %}{{ seo_meta_description }}{% endblock %}">
<meta name="author" content="{{ company_name }}">
<meta name="robots" content="{% block meta_robots %}index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1{% endblock %}">
<link rel="canonical" href="{% block canonical_url %}{{ request.scheme }}://{{ request.get_host }}{{ request.path }}{% endblock %}">

<meta property="og:type" content="{% block og_type %}website{% endblock %}">
<meta property="og:title" content="{% block og_title %}{{ seo_meta_title }}{% endblock %}">
<meta property="og:description" content="{% block og_description %}{{ seo_meta_description }}{% endblock %}">
<meta property="og:url" content="{% block og_url %}{{ request.scheme }}://{{ request.get_host }}{{ request.path }}{% endblock %}">
<meta property="og:site_name" content="{{ company_name }}">
<meta property="og:image" content="{% block og_image %}{{ request.scheme }}://{{ request.get_host }}{% static seo_og_image_path %}{% endblock %}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_AU">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% block twitter_title %}{{ seo_meta_title }}{% endblock %}">
<meta name="twitter:description" content="{% block twitter_description %}{{ seo_meta_description }}{% endblock %}">
<meta name="twitter:image" content="{% block twitter_image %}{{ request.scheme }}://{{ request.get_host }}{% static seo_og_image_path %}{% endblock %}">

<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=yes">

<link rel="icon" type="image/x-icon" href="{% block favicon %}{% static 'images/favicon.ico' %}{% endblock %}">
<link rel="manifest" href="{% static 'manifest.json' %}">
